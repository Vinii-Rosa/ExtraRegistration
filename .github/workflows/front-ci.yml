name: FRONT CI

on:
  push:
    branches: [main]
    paths: ['FRONT/**', '.github/workflows/front-ci.yml']
  pull_request:
    paths: ['FRONT/**', '.github/workflows/front-ci.yml']

concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: FRONT

jobs:
  quality:
    name: Qualidade (lint, tipos e build)
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FRONT/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FRONT/package-lock.json
      - run: npm ci
      - run: npm test
