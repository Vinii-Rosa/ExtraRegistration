services:
  extra_hour:
    build: .
    container_name: extra_hour
    env_file:
      - .env
    environment:
      DB_HOST: extra_hour_db
      DB_PORT: 3306
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - .:/app
      - extra_hour_node_modules:/app/node_modules
    depends_on:
      extra_hour_db:
        condition: service_healthy

  extra_hour_db:
    image: mysql:8.4
    container_name: extra_hour_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: extra_hour
    volumes:
      - extra_hour_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  extra_hour_mysql_data:
  extra_hour_node_modules:
