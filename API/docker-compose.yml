services:
  extra_hour:
    build: .
    container_name: extra_hour
    env_file:
      - .env
    environment:
      DB_HOST: extra_hour_db
      DB_PORT: 3306
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - extra_hour_node_modules:/app/node_modules
    depends_on:
      extra_hour_db:
        condition: service_healthy

  extra_hour_db:
    image: mariadb:11.4
    container_name: extra_hour_db
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: extra_hour
    volumes:
      - extra_hour_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  extra_hour_db_data:
  extra_hour_node_modules:
